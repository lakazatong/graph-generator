[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-generator"
version = "0.1.0"
description = "Configurable graph generation and analysis toolkit"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.4",
    "numpy>=1.26",
    "sympy>=1.12",
    "pyyaml>=6.0",
    "dacite",
    "variable-resolver",
    "seedstream"
]

[project.scripts]
ggen = "ggen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
variable-resolver = { path = "../variable-resolver", editable = true }
seedstream = { path = "../seedstream", editable = true }
